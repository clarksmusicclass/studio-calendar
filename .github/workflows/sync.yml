name: Sync Calendar

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Fetch calendar
        run: |
          curl -L \
            -H "Cookie: TeacherPortalAuth=${{ secrets.MMS_COOKIE }}" \
            "https://app.mymusicstaff.com/CalendarFeed.ashx?User=tch_mS8J2.qoKLnlTWJvgjeZr3Rm1%2BN1OkhFyp8JlGhW1gy3MxIkg%3D" \
            -o calendar.ics

      - name: Validate calendar file (critical)
        run: |
          if ! grep -q "BEGIN:VCALENDAR" calendar.ics; then
            echo "Downloaded file is not a real ICS — authentication expired"
            echo "---- FILE CONTENT ----"
            head -n 20 calendar.ics
            exit 1
          fi

      - name: Remove student names (privacy filter)
        run: |
          sed -i 's/SUMMARY:.*/SUMMARY:Lesson/g' calendar.ics

      - name: Fix floating times (make FullCalendar accept events)
        run: |
          sed -i -E 's/DTSTART:([0-9T]+)/DTSTART:\1Z/g' calendar.ics
          sed -i -E 's/DTEND:([0-9T]+)/DTEND:\1Z/g' calendar.ics
          
      - name: Remove UTC timezone flag (critical)
        run: |
          sed -i 's/Z$//' calendar.ics

      - name: Add correct lesson durations (safe VEVENT patch)
        run: |
          awk '
          function add_minutes(y,mo,d,h,mi,extra){
            mi+=extra
            while(mi>=60){mi-=60;h++}
            return sprintf("%04d%02d%02dT%02d%02d00",y,mo,d,h,mi)
          }

          BEGIN{in_event=0;duration=30}

          /BEGIN:VEVENT/{
            in_event=1
            duration=30
            print
            next
          }

          /SUMMARY:/{
            if($0~/Introductory Lesson/)duration=30
            else if($0~/Private Lesson/)duration=30
            else if($0~/Lesson/)duration=50
            print
            next
          }

          /DTSTART:/ && in_event{
            print
            start=$0
            gsub("DTSTART:","",start)

            y=substr(start,1,4)
            mo=substr(start,5,2)
            d=substr(start,7,2)
            h=substr(start,10,2)
            mi=substr(start,12,2)

            end=add_minutes(y,mo,d,h,mi,duration)
            print "DTEND:" end
            next
          }

          /END:VEVENT/{
            in_event=0
            print
            next
          }

          {print}
          ' calendar.ics > fixed.ics && mv fixed.ics calendar.ics

      - name: Push update
        run: |
          git config --global user.name "calendar-bot"
          git config --global user.email "bot@example.com"
          git add calendar.ics
          git commit -m "update calendar" || echo "no changes"
          git push

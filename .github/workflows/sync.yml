name: Sync Teacher Calendar

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Download Google Calendar
        run: |
          curl -L "http://app.mymusicstaff.com/CalendarFeed.ashx?User=tch_mS8J2.cFWGo%2FudUHuD1lno" -o calendar.ics

      - name: Commit updated calendar
        run: |
          git config user.name "calendar-bot"
          git config user.email "bot@github.com"
          git add calendar.ics
          git commit -m "Update calendar" || echo "No changes"
          git push

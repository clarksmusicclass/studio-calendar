name: Sync Calendar

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Fetch calendar
        run: |
          curl 'https://app.mymusicstaff.com/CalendarFeed.ashx?User=tch_mS8J2.qoKLn1TWJvgjeZr3Rm1%2BN10khFyp8JlGhW1gy3MxIkg%3D' \
            -L \
            -o calendar.ics \
            -H 'authority: app.mymusicstaff.com' \
            -H 'accept: text/calendar,*/*;q=0.9' \
            -H 'accept-language: en-US,en;q=0.9' \
            -H 'referer: https://app.mymusicstaff.com/' \
            -H 'user-agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 14_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36'

      - name: Remove student names (privacy filter)
        run: |
          sed -i 's/SUMMARY:.*/SUMMARY:Lesson/g' calendar.ics

      - name: Fix timezone (make website show events)
        run: |
          sed -i -E 's/(DSTART:[0-9T]+)/\1Z/g' calendar.ics
          sed -i -E 's/(DTEND:[0-9T]+)/\1Z/g' calendar.ics

      - name: Add correct lesson durations
        run: |
          awk '
          function add_minutes(y,mo,d,h,mi,extra){
             mi += extra
             while (mi >= 60) { mi -= 60; h += 1 }
            return sprintf("%s%s%sT%02d%02d00Z",y,mo,d,h,mi)
          }

          BEGIN { in_event=0; duration=30 }

          /BEGIN:VEVENT/ {
              in_event=1
              duration=30
              summary=""
              print
              next
          }

          /SUMMARY:/ {
              summary=$0

              if ($0 ~ /Introductory Lesson/) duration=30
              else if ($0 ~ /Private Lesson/) duration=30
              else if ($0 ~ /Lesson/) duration=50

              print
              next
          }

          /DTSTART:/ {
              print
              start=$0
              gsub("DTSTART:", "", start)

              y=substr(start,1,4)
              mo=substr(start,5,2)
              d=substr(start,7,2)
              h=substr(start,10,2)
              mi=substr(start,12,2)

              end=add_minutes(y,mo,d,h,mi,duration)
              print "DTEND:" end
              next
          }

          { print }
          ' calendar.ics > fixed.ics && mv fixed.ics calendar.ics

      - name: Push update
        run: |
          git config --global user.name "calendar-bot"
          git config --global user.email "bot@example.com"
          git add calendar.ics
          git commit -m "update calendar" || echo "no changes"
          git push

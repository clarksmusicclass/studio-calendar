name: Sync Calendar

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Fetch calendar
        run: >
          curl -L --fail
          -H "Accept: text/calendar"
          -H "User-Agent: Mozilla/5.0"
          "https://app.mymusicstaff.com/CalendarFeed.ashx?User=tch_mS8J2.qoKLnlTWJvgjeZr3Rm1%2BN10khFyp8JlGhW1gy3MxIkg%3D"
          -o calendar.ics

      - name: Remove student names (privacy filter)
        run: |
          sed -i 's/SUMMARY:.*/SUMMARY:Lesson/g' calendar.ics

      - name: Add end times (fix blank website calendar)
        run: |
          awk '
          /BEGIN:VEVENT/ {event=1}
          /DTSTART:/ {start=$0}
          /END:VEVENT/ {
              if (event && start && !seen_end) {
                  gsub("DTSTART:", "", start)
                  cmd = "date -u -d \"" start "\" +DTEND:%Y%m%dT%H%M%SZ"
                  cmd | getline dtend
                  close(cmd)
                  print dtend
              }
              event=0
              seen_end=0
          }
          /DTEND:/ {seen_end=1}
          {print}
          ' calendar.ics > fixed.ics && mv fixed.ics calendar.ics    

      - name: Push update
        run: |
          git config --global user.name "calendar-bot"
          git config --global user.email "bot@example.com"
          git add calendar.ics
          git commit -m "update calendar" || echo "no changes"
          git push

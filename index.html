<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Clark's Music Class — Teacher Lesson Schedule</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#eef1f4;
}

.header{
  background:#243447;
  color:white;
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}

.wrap{
  padding:20px;
}

/* frame holds the google calendar */
.frame{
  position:relative;
  width:100%;
  height:900px;
  border-radius:10px;
  overflow:hidden;
  background:white;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.frame iframe{
  width:100%;
  height:900px;
  border:0;
}
</style>
</head>

<body>

<div class="header">Clark's Music Class — Teacher Lesson Schedule</div>

<div class="wrap">
  <div class="frame">
    <iframe src="https://calendar.google.com/calendar/embed?src=f23db1d5d9534184c7d314f59cf5365548a1170b3921dd85e657d83d53cefac3%40group.calendar.google.com&mode=WEEK&showTitle=0&showPrint=0&showTabs=1&showCalendars=0&showTz=0&ctz=America/Chicago">
    </iframe>
  </div>
</div>

</body>
</html>

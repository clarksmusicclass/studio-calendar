<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Clark's Music Class — Teacher Lesson Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.11/index.global.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#eef1f4;
}

.header{
  background:#243447;
  color:white;
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
}

#calendar{
  max-width:1200px;
  margin:30px auto;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

/* make lesson blocks look cleaner */
.fc-event{
  border:none !important;
  background:#4f6fad !important;
  color:white !important;
  font-weight:bold;
  padding:2px 4px;
  border-radius:6px;
}

.fc-toolbar-title{
  font-size:20px !important;
}
</style>
</head>

<body>

<div class="header">Clark's Music Class — Teacher Lesson Schedule</div>
<div id="calendar"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {

  const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'timeGridWeek',

    height: "auto",
    nowIndicator: true,

    slotMinTime: "07:00:00",
    slotMaxTime: "22:00:00",

    expandRows: true,
    allDaySlot: false,

    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'timeGridWeek,dayGridMonth,listWeek'
    },

    events: {
      url: 'calendar.ics',
      format: 'ics'
    },

    eventDidMount: function(info){
      // remove event click behavior entirely
      info.el.style.cursor = "default";
      info.el.removeAttribute("href");
    }
  });

  calendar.render();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Clark's Music Class Teacher Schedule</title>
<style>
body{margin:0;font-family:Arial;background:#eef1f4;}

.header{
background:#243447;
color:white;
text-align:center;
padding:18px;
font-size:22px;
font-weight:bold;
}

.wrap{padding:20px;}

.frame{
position:relative;
width:100%;
height:900px;
overflow:hidden;
border-radius:8px;
}

/* hide early morning hours (top mask) */
.frame::before{
content:"";
position:absolute;
left:0;
right:0;
top:120px;        /* leaves toolbar visible */
height:260px;     /* covers midnight–~7am */
background:#eef1f4;
z-index:5;
pointer-events:none;
}

/* hide late night hours (bottom mask) */
.frame::after{
content:"";
position:absolute;
left:0;
right:0;
bottom:0;
height:200px;     /* hides after ~10pm */
background:#eef1f4;
z-index:5;
pointer-events:none;
}

/* DO NOT shift calendar anymore */
.frame iframe{
width:100%;
height:1400px;
border:0;
position:relative;
top:0px;
}
</style>
</head>
<body>

<div class="header">Clark's Music Class — Teacher Lesson Schedule</div>

<div class="wrap">
<div class="frame">
<iframe src="https://calendar.google.com/calendar/embed?src=f23db1d5d9534184c7d314f59cf5365548a1170b3921dd85e657d83d53cefac3%40group.calendar.google.com&mode=WEEK&ctz=America/Chicago&showTitle=0&showPrint=0&showTabs=1&showCalendars=0&showTz=0"></iframe>
</div>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Clark's Music Class — Teacher Lesson Schedule</title>

<style>

  /* MOBILE FIX */
@media (max-width:700px){

  /* give the page side gutters for thumb scrolling */
  .wrap{
    padding:28px 22px 80px 22px;
  }

  /* center the calendar and make it narrower than screen */
  .frame{
    height:1150px;
    margin:18px auto 40px auto;
    border-radius:16px;

    width:calc(100%-70px);           /* IMPORTANT — no longer full width */
    max-width:460px;     /* keeps it comfortable on large phones */
  }

  .frame iframe{
    height:1150px;
  }

/* side touch gutters (VERY IMPORTANT) */
.frame::before,
.frame::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:100px;           /* size of thumb rail */
  z-index:5;
}

.frame::before{
  left:-22px;
}

.frame::after{
  right:-22px;
}

 /* allow page scrolling when touching edges */
.frame::before,
.frame::after{
  pointer-events:auto;
} 
}
  
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#eef1f4;
    /* 🔥 prevents mobile refresh when calendar hits top/bottom */
  overscroll-behavior-y: contain;
}
  
html, body{
  overscroll-behavior-y: none;
  height:100%;
}

  .wrap{
  overscroll-behavior:none;
}
  
  .frame{
  touch-action: pan-y;
}
  
.header{
  background:#243447;
  color:white;
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:5;
}

.wrap{
  padding:20px;
}
  
html, body{
  height:100%;
  overflow-x:hidden;
}
  
/* frame holds the google calendar */
.frame{
  position:relative;
  width:100%;
  height:900px;
  border-radius:8px;
  overflow:hidden;
  background:white;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.frame iframe{
  width:100%;
  height:900px;
  border:0;
  position:relative;
  top:0;
}

  @media (max-width:700px){
  .frame{
    height:1500px;
  }
  .frame iframe{
    height:1500px;
  }
}
</style>
</head>

<body>

<div class="header">Clark's Music Class — Teacher Lesson Schedule</div>

<div class="wrap">
  <div class="frame">
    <iframe id="calendarFrame"></iframe>
<script>
function loadCalendar(){

  const frame = document.getElementById("calendarFrame");
  if(!frame) return;

  const isPhone = window.innerWidth <= 700;

  if(isPhone){
    // 📱 PHONE — Agenda (easy to read)
    frame.src =
    "https://calendar.google.com/calendar/embed?src=f23db1d5d9534184c7d314f59cf5365548a1170b3921dd85e657d83d53cefac3%40group.calendar.google.com&mode=AGENDA&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&ctz=America/Chicago";
  }else{
    // 💻 DESKTOP — Weekly grid
    frame.src =
    "https://calendar.google.com/calendar/embed?src=f23db1d5d9534184c7d314f59cf5365548a1170b3921dd85e657d83d53cefac3%40group.calendar.google.com&mode=WEEK&showTitle=0&showPrint=0&showTabs=1&showCalendars=0&showTz=0&ctz=America/Chicago";
  }
}

/* wait for page to exist */
window.addEventListener("load", loadCalendar);

/* phone rotation */
window.addEventListener("orientationchange", loadCalendar);

/* desktop resize */
window.addEventListener("resize", loadCalendar);
</script>
<script>
/* ---- TRUE ANDROID PULL-TO-REFRESH BLOCKER ---- */

let startY = 0;

window.addEventListener('touchstart', function(e){
  startY = e.touches[0].clientY;
}, {passive:true});

window.addEventListener('touchmove', function(e){

  const currentY = e.touches[0].clientY;
  const pullingDown = currentY > startY;

  /* finger is near top 120px of screen */
  const nearTopOfScreen = startY < 120;

  if(pullingDown && nearTopOfScreen){
    e.preventDefault();
  }

}, {passive:false});
</script>
    
  </div>
</div>

</body>
</html>
